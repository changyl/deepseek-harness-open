# Agent Teams profile layer. Apply after dsh-base (which mounts the Team
# service) so these replacements keep direct delegation and coordination on the
# Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
