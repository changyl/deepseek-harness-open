# Agent Teams profile layer. Apply after dsh-base (which mounts the Team
# service) so these replacements remove the global continuable-child controls
# before the scoped Team tools register the overlapping list_agents,
# send_message, and interrupt_agent names.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
